[project]
name = "livecode-archive"
version = "1.01"
description = "A tool used to archive all of the videos from a livecode stream using muxy"
classifiers = [
       "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication"
]
authors = [
       {name = "Scott Fradkin", email = "scott@fradkin.com"}
]
maintainers = [
       {name = "Scott Fradkin", email = "scott@fradkin.com"}
]
requires-python = ">=3.12"
dependencies = ["internetarchive",
                "google-api-python-client",
                "google-auth-oauthlib",
                "ffmpeg-python",
                "tqdm",
                "unidecode"]

[dependency-groups]
dev = ["pytest",
       "pre-commit",
       "ruff",
       "mypy",
       "types-requests",
       "detect-secrets"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (incl. unused imports), I: isort, B: bugbear, UP: pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines are mostly string literals (templates, descriptions); the formatter handles code wrapping.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
